spring:
  application:
    name: "ChatBotUsingRAG"

  datasource:
    url: jdbc:mysql://localhost:3306/ragdb
    username: root
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    openai:
      api-key: ${API_KEY}

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: CompanyPolicies
        initialize-schema: true
